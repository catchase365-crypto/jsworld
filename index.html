<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 离线调用大全 (IndexedDB 引擎)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        :root { --bg: #000000; --text: #00ff41; --border: #008f11; --card-bg: rgba(0, 20, 0, 0.9); }
        body { font-family: monospace, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        
        .header { display: flex; flex-direction: column; gap: 10px; max-width: 800px; margin: 0 auto 20px auto; }
        input[type="text"] { padding: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--text); border-radius: 6px; font-size: 16px; width: 100%; box-sizing: border-box; }
        input[type="text"]:focus { outline: none; box-shadow: 0 0 10px rgba(0, 255, 65, 0.4); }
        
        .import-btn { background: var(--card-bg); border: 1px dashed var(--text); color: var(--text); padding: 10px; cursor: pointer; text-align: center; border-radius: 6px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 10px rgba(0, 255, 65, 0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
        .card-title { font-size: 18px; font-weight: bold; }
        .badge { background: var(--text); color: var(--bg); padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        
        .desc { font-size: 14px; color: #888; line-height: 1.4; }
        
        .code-block { background: #001100; border: 1px solid var(--border); padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; color: #a1f2c2; margin: 0; white-space: pre-wrap; word-break: break-all; }
        
        .actions { display: flex; gap: 10px; margin-top: auto; }
        button { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px; cursor: pointer; border-radius: 4px; font-family: monospace; transition: all 0.2s; }
        button:hover { background: var(--text); color: var(--bg); }
        
        #status { text-align: center; font-size: 12px; opacity: 0.7; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; text-align:center;">🔌 JS 全世界调用大全</h2>
    <div id="status">正在检查本地数据库...</div>
    
    <label class="import-btn" id="uploadLabel">
        📂 点击导入生成的 js_libraries.jsonl 初始化数据库
        <input type="file" id="fileInput" accept=".jsonl" style="display: none;">
    </label>
    
    <input type="text" id="searchInput" placeholder="搜索库名或功能描述 (例如: 动画, react, 图表)...">
</div>

<div class="grid" id="resultsGrid"></div>

<script>
let allLibraries = [];

async function initDB() {
    const status = document.getElementById('status');
    const storedData = await localforage.getItem('js_libraries_db');
    
    if (storedData && storedData.length > 0) {
        allLibraries = storedData;
        document.getElementById('uploadLabel').style.display = 'none';
        status.innerText = `✅ 已离线加载 ${allLibraries.length} 个库`;
        renderCards(allLibraries.slice(0, 50)); // 默认渲染前50个
    } else {
        status.innerText = `⚠️ 本地数据库为空，请导入 JSONL 数据文件`;
    }
}

// 监听文件上传 (突破跨域限制，直接在浏览器端解析)
document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    document.getElementById('status').innerText = '⏳ 正在解析并压入 IndexedDB...';
    const reader = new FileReader();
    
    reader.onload = async (event) => {
        const text = event.target.result;
        const lines = text.split('\n').filter(line => line.trim());
        
        const parsedData = [];
        lines.forEach(line => {
            try { parsedData.push(JSON.parse(line)); } catch(err) {}
        });
        
        await localforage.setItem('js_libraries_db', parsedData);
        allLibraries = parsedData;
        document.getElementById('uploadLabel').style.display = 'none';
        document.getElementById('status').innerText = `✅ 成功持久化 ${allLibraries.length} 个库！`;
        renderCards(allLibraries.slice(0, 50));
    };
    
    reader.readAsText(file);
});

// 极速离线搜索
document.getElementById('searchInput').addEventListener('input', (e) => {
    const keyword = e.target.value.toLowerCase().trim();
    if (!keyword) {
        renderCards(allLibraries.slice(0, 50));
        return;
    }
    
    const results = allLibraries.filter(lib => 
        (lib.t && lib.t.toLowerCase().includes(keyword)) || 
        (lib.c && lib.c.toLowerCase().includes(keyword)) ||
        (lib.desc && lib.desc.toLowerCase().includes(keyword))
    );
    
    renderCards(results.slice(0, 100)); // 限制最多显示100个防止卡顿
});

function renderCards(dataArray) {
    const grid = document.getElementById('resultsGrid');
    grid.innerHTML = '';
    
    dataArray.forEach(lib => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <div class="card-title">${lib.t}</div>
                <div class="badge">${lib.c || '通用'}</div>
            </div>
            <div class="desc">${lib.desc}</div>
            <pre class="code-block">${lib.demo}</pre>
            <div class="actions">
                <button onclick="copyText('<script src=\\'${lib.url}\\'><\\/script>')">复制 CDN</button>
                <button onclick="copyText(this.parentElement.previousElementSibling.innerText)">复制 Demo</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
        // 简易提示
        const toast = document.createElement('div');
        toast.innerText = "复制成功！";
        toast.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#00ff41; color:#000; padding:10px 20px; border-radius:20px; font-weight:bold; z-index:9999;";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
    });
}

// 启动
window.onload = initDB;
</script>
</body>
</html>
